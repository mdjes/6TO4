<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریت 6To4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #091217, #132733, #1c3d4a);
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .input-field {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #06b6d4;
            outline: none;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.8); }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="glass-card flex justify-between items-center p-4 md:px-8 mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center font-bold text-lg shadow-lg">
                6
            </div>
            <h1 class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-400">
                پنل مدیریت تانل
            </h1>
        </div>
        <a href="/logout" class="px-4 py-2 rounded-lg bg-red-500/20 text-red-300 hover:bg-red-500/40 border border-red-500/30 transition-all font-medium flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            خروج
        </a>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
        
        <!-- Main Configuration Panel -->
        <div class="glass-card p-6 lg:col-span-2">
            <h2 class="text-xl font-semibold mb-6 flex items-center gap-2 border-b border-gray-700/50 pb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                تنظیمات تانل
            </h2>
            <form id="configForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">نوع تانل (Protocol)</label>
                        <select id="tunnelType" class="input-field w-full rounded-lg px-4 py-3">
                            <option value="6to4">6To4</option>
                            <option value="geneve">Geneve</option>
                            <option value="gre">GRE</option>
                            <option value="gre6">GRE6</option>
                            <option value="ip6ip6">IP6IP6</option>
                            <option value="sit">SIT</option>
                            <option value="erspan">Erspan + IPsec</option>
                            <option value="wireguard">WireGuard</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">مقدار MTU</label>
                        <input type="number" id="mtu" class="input-field w-full rounded-lg px-4 py-3" placeholder="مثال: 1420" value="1420">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">آی‌پی سرور ایران (Local)</label>
                        <input type="text" id="localIp" class="input-field w-full rounded-lg px-4 py-3" placeholder="10.10.10.1" required>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-2">آی‌پی سرور خارج (Remote)</label>
                        <input type="text" id="remoteIp" class="input-field w-full rounded-lg px-4 py-3" placeholder="20.20.20.1" required>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 pt-2">
                    <input type="checkbox" id="ipv6Native" class="w-5 h-5 accent-cyan-500 rounded bg-gray-800 border-gray-600">
                    <label for="ipv6Native" class="text-sm text-gray-300">دارای Native IPv6</label>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="ipForwarding" class="w-5 h-5 accent-cyan-500 rounded bg-gray-800 border-gray-600" checked>
                    <label for="ipForwarding" class="text-sm text-gray-300">فعال سازی IP Forwarding</label>
                </div>

                <div class="pt-4 border-t border-gray-700/50 flex justify-end gap-3">
                    <button type="button" onclick="applyConfig()" class="bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white px-6 py-2.5 rounded-lg shadow-lg font-medium transition-all transform active:scale-95">
                        ذخیره و اعمال تنظیمات
                    </button>
                </div>
            </form>
        </div>

        <!-- Sidebar Tools -->
        <div class="flex flex-col gap-8">
            
            <!-- Quick Install -->
            <div class="glass-card p-6 relative overflow-hidden group cursor-pointer" onclick="quickInstall()">
                <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 to-blue-600/10 transform translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                <h3 class="text-lg font-bold mb-2 flex items-center gap-2 relative z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    نصب سریع (Quick Install)
                </h3>
                <p class="text-sm text-gray-400 relative z-10 leading-relaxed">
                    اجرای خودکار اسکریپت اصلی (ipip.py) با تنظیمات پیش‌فرض به صورت پس‌زمینه.
                </p>
                <div class="mt-4 inline-flex text-cyan-400 text-sm font-medium items-center gap-1 relative z-10 group-hover:gap-2 transition-all">
                    شروع نصب
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </div>
            </div>

            <!-- Connection Test -->
            <div class="glass-card p-6 flex-grow">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2 border-b border-gray-700/50 pb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
                    </svg>
                    تست کانکشن
                </h3>
                <div class="space-y-4">
                    <div>
                        <input type="text" id="pingIp" class="input-field w-full rounded-lg px-4 py-2 text-sm text-left" dir="ltr" placeholder="مثال: 8.8.8.8 یا IP سرور">
                    </div>
                    <button id="btnPing" onclick="testConnection()" class="w-full bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-md flex items-center justify-center gap-2">
                        <span>گرفتن پینگ (Ping)</span>
                    </button>
                    <div id="pingResult" class="hidden mt-4 bg-black/50 p-3 rounded-lg border border-gray-700 overflow-x-auto text-xs text-green-400 font-mono text-left" dir="ltr">
                        <!-- Ping result goes here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script>
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            background: 'rgba(20, 30, 40, 0.95)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-md border border-gray-700'
            }
        });

        async function applyConfig() {
            const data = {
                tunnelType: document.getElementById('tunnelType').value,
                mtu: document.getElementById('mtu').value,
                localIp: document.getElementById('localIp').value,
                remoteIp: document.getElementById('remoteIp').value,
                ipv6Native: document.getElementById('ipv6Native').checked,
                ipForwarding: document.getElementById('ipForwarding').checked
            };

            try {
                const res = await fetch('/api/apply_config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if(result.success) {
                    Toast.fire({ icon: 'success', title: result.message });
                } else {
                    Toast.fire({ icon: 'error', title: result.message || 'خطا در اعمال تنظیمات' });
                }
            } catch (err) {
                Toast.fire({ icon: 'error', title: 'خطا در ارتباط با سرور' });
            }
        }

        async function quickInstall() {
            Swal.fire({
                title: 'آیا مطمئن هستید؟',
                text: "اسکریپت به صورت خودکار نصب خواهد شد.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#0ea5e9',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'بله، نصب کن',
                cancelButtonText: 'لغو',
                background: 'rgba(20, 30, 40, 0.98)',
                color: '#fff'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const res = await fetch('/api/quick_install', { method: 'POST' });
                        const json = await res.json();
                        if(json.success) {
                            Swal.fire({
                                title: 'شروع شد!',
                                text: json.message,
                                icon: 'success',
                                background: 'rgba(20, 30, 40, 0.98)',
                                color: '#fff'
                            });
                        }
                    } catch (err) {
                        Toast.fire({ icon: 'error', title: 'خطا در اجرای اسکریپت' });
                    }
                }
            });
        }

        async function testConnection() {
            const ip = document.getElementById('pingIp').value;
            if(!ip) {
                Toast.fire({ icon: 'warning', title: 'لطفا آدرس IP را وارد کنید' });
                return;
            }

            const btn = document.getElementById('btnPing');
            const resultDiv = document.getElementById('pingResult');
            
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال بررسی...`;
            btn.disabled = true;
            resultDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/test_connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip })
                });
                const result = await res.json();
                
                resultDiv.classList.remove('hidden');
                resultDiv.innerText = result.details || result.message;
                
                if(result.success) {
                    Toast.fire({ icon: 'success', title: result.message });
                    resultDiv.className = 'mt-4 bg-black/50 p-3 rounded-lg border border-green-500/50 overflow-x-auto text-xs text-green-400 font-mono text-left block';
                } else {
                    Toast.fire({ icon: 'error', title: result.message });
                    resultDiv.className = 'mt-4 bg-black/50 p-3 rounded-lg border border-red-500/50 overflow-x-auto text-xs text-red-400 font-mono text-left block';
                }
            } catch (err) {
                Toast.fire({ icon: 'error', title: 'خطا در ارتباط' });
            } finally {
                btn.innerHTML = `<span>گرفتن پینگ (Ping)</span>`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
