<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل 6To4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 100% 100%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 0% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-premium {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: white;
            transition: all 0.3s;
        }
        .input-premium:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }
    </style>
</head>
<body>

    <div class="glass p-8 md:p-10 rounded-3xl w-11/12 max-w-md text-center transform transition-all hover:scale-[1.01]">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30 mb-6">
            <i class="fa-solid fa-shield-halved text-4xl text-white"></i>
        </div>
        
        <h1 class="text-3xl font-black text-white mb-2">پنل 6TO4</h1>
        <p class="text-slate-400 text-sm mb-8">جهت ورود رمز عبور خود را وارد کنید</p>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm py-3 px-4 rounded-xl mb-6">
            <i class="fa-solid fa-circle-exclamation ml-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-6">
            <div class="relative">
                <i class="fa-solid fa-lock absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="password" name="password" required class="input-premium w-full rounded-xl py-4 pr-12 pl-4 text-center font-mono tracking-widest text-lg placeholder-slate-500" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-blue-500/20 transition-all transform active:scale-95">
                ورود به پنل
            </button>
        </form>
    </div>

</body>
</html>
